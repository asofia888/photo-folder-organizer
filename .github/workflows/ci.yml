name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-check is a hard gate: `npm run type-check` must pass with zero errors.
      - name: Type check
        run: npm run type-check

      # All test files pass. (Locally the full run can hit a JS-heap limit on
      # very memory-constrained machines; the worker heap is raised in
      # vitest.config.ts and CI runners have ample memory.)
      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
